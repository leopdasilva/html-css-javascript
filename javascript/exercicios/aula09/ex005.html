<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../favicon-doge.ico" type="image/x-icon">
    <title>Primeiros passos com DOM</title>
    <style>
        body {
            background: rgb(68, 125, 199);
            color: white;
            font: normal 18px Arial;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudo com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em JavaScript.</p>
    <div id="msg">Clique em mim</div>
    <script>
        var corpo = window.document.body
        var p1 = window.document.getElementsByTagName('p')[1] 
        /*
        Por id

        var d = window.document.getElementById('msg')
        d.style.background = 'green'
        d.innerText = 'Estou aguardando...'
        */

        /*
        Por name
        
        var d = window.document.getElementsByName('msg')[0]
        d.innerText = 'Olá!'
        */

        /*
        Por ClassName

        var d = window.document.getElementsByClassName('msg')[0]
        d.innerText = 'Olá!'
        */

        var d = window.document.querySelector('div#msg')
        d.style.background = 'blue'
    </script>
    <hr>
    <a href="../../../lista-de-exercicios/Lista_exercícios_e_desafios.html">Ir para a lista de exercícios</a>
</body>
</html>
