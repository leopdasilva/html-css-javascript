<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Par ou Impar</title>
    <style>
        body {
            font-size: 2rem;
        }

        input {
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <h1>Par Ou Impar</h1>
    <p>
        Digite um numero:
        <input type="number" name="txtnum" id="txtnum">
        <input type="button" value="Vereficar" onclick="ParOuImpar()">
        <div id="res"></div>
    </p>
    <script>
        function ParOuImpar() {
            var txtnum = window.document.querySelector('#txtnum')
            var res = window.document.querySelector('#res')
            var num = Number(txtnum.value)
            if (num % 2 == 0) {
                res.innerHTML = `O numero ${num} é <strong>PAR!</strong>`
            } else {
                res.innerHTML = `O numero ${num} é <strong>IMPAR!</strong>`
            }
        }
    </script>

</body>
</html>
