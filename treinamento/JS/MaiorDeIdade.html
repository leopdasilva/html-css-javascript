<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maior de Idade</title>
    <style>
        body {
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <h1>Treinamento- If Else</h1>
    <p>
        Insira a idade: 
        <input type="number" name="txtidade" id="txtidade">
        <input type="button" value="Vereficar" onclick="VereficarIdade()">
        <div id="res"></div>
    </p>
    <script>
        function VereficarIdade() {
            var txtidade = window.document.querySelector('#txtidade')
            var res = window.document.querySelector('#res')
            var idade = Number(txtidade.value)
            if (idade >= 18) {
                res.innerHTML = `A idade é de ${idade} anos. Você é <strong>MAIOR DE IDADE!</strong>`
            } else {
               res.innerHTML = `A idade é de ${idade} anos. Você é <strong>MENOR DE IDADE!</strong>` 
            }
        }
    </script>
</body>
</html>
